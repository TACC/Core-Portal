[project]
name = "portal"
version = "3.0.0"
description = "Django backend for the core portal."
authors = [
    { name = "TACC-WMA", email = "wma-portals@tacc.utexas.edu" },
]
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "Django>=5.2,<6.0",
    "elasticsearch-dsl>=7.2.1,<8.0.0",
    "paramiko>=3.4.0,<4.0.0",
    "rt>=2.0.0,<3.0.0",
    "psycopg[binary]>= 3.1.12,<4.0.0",
    "django-settings-export>=1.2.1,<2.0.0",
    "redis>=4.5.4,<5.0.0",
    "celery>=5.2.2,<6.0.0",
    "django-termsandconditions>=2.0.11,<3.0.0",
    "PyJWT>=2.6.0,<3.0.0",
    "kombu>=5.2.3,<6.0.0",
    "cryptography>=44.0.1,<45.0.0",
    "cached-property>=1.5.1,<2.0.0",
    "ipython>=9.0.2,<10.0.0",
    "pycryptodome>=3.19.1,<4.0.0",
    "elasticsearch>=7.7.1,<8.0.0",
    "uwsgi>=2.0.22,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "django-impersonate>=1.5,<2.0.0",
    "channels>=4.0.0,<5.0.0",
    "channels-redis>=4.1.0,<5.0.0",
    "daphne>=4.0.0,<5.0.0",
    "pytas",
    "google-auth>=1.23.0,<2.0.0",
    "google-auth-oauthlib>=0.4.2,<1.0.0",
    "google-api-python-client>=1.12.5,<2.0.0",
    "jsonpickle>=1.4.1,<2.0.0",
    "python-magic>=0.4.18,<1.0.0",
    "zeep>=4.1.0,<5.0.0",
    "tapipy>=25.4.0,<26.0.0",
    "gevent>=23.9.1,<24.0.0",
    "pymemcache>=4.0.0,<5.0.0",
    "twisted[http2,tls]>=24.11.0,<25.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "networkx>=3.2.1,<4.0.0",
    "numpy<2.0",
    "matplotlib>=3.10.0,<4.0.0",
    "tifffile>=2025.1.10,<2026.0.0",
    "httpx>=0.28.1,<0.29.0",
    "imagecodecs==2025.8.2",
]

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "mock>=5.0.2,<6.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-django>=4.5.2,<5.0.0",
    "pytest-asyncio>=0.21.1,<1.0.0",
    "coverage>=7.2.5,<8.0.0",
    "requests-mock>=1.10.0,<2.0.0",
    "ruff>=0.16.5,<0.17.0",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
pytas = { git = "https://bitbucket.org/taccaci/pytas.git", tag = "v1.6.0" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
