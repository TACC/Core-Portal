allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: true

minimumReleaseAge: 10080 # Only install packages >1 week old
minimumReleaseAgeExclude:
  - '@tacc/core-styles'

packages:
  - 'packages/*'

catalog:
  react: ^19.3.1
  '@tanstack/react-query': ^5.105.0
  'axios': ^1.21.0
  'typescript': '^6.0.3'
  msw: ^2.15.0
  '@tailwindcss/vite': ^4.3.3
  tailwindcss: ^4.3.3
  vitest: ^5.0.5
  vite: ^8.3.5
